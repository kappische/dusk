<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132d35"><title>RIDGELINE // Cel Downhill BMX</title><style>html,body{margin:0;height:100%;background:#132d35;color:#fff0a8;font-family:system-ui;display:grid;place-items:center}#s{font-weight:900;letter-spacing:.14em;text-align:center;padding:24px}</style></head><body><div id="s">LOADING RIDGELINE…</div><script type="module">try{const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch(`./chunks/${i}.txt`).then(r=>{if(!r.ok)throw new Error(`chunk ${i}`);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('#s').textContent='LOAD FAILED — '+e.message;console.error(e)}</script></body></html>
