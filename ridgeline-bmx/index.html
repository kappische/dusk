<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132d35"><title>RIDGELINE // Cel Downhill BMX</title><style>html,body{margin:0;height:100%;background:#132d35;color:#fff0a8;font-family:system-ui;display:grid;place-items:center}#s{font-weight:900;letter-spacing:.14em;text-align:center;padding:24px;max-width:560px}.small{display:block;font-size:12px;margin-top:14px;opacity:.75;letter-spacing:.05em}</style></head><body><div id="s">LOADING RIDGELINE…<span class="small">First load can take a moment.</span></div><script type="module">try{const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch(`./chunks/${i}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`download ${i+1}/8 failed`);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('Safari is too old for the game loader');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const page=URL.createObjectURL(new Blob([html],{type:'text/html'}));location.replace(page)}catch(e){document.querySelector('#s').innerHTML='LOAD FAILED<span class="small">'+String(e?.message||e)+'<br>Reload the page once.</span>';console.error(e)}</script></body></html>
